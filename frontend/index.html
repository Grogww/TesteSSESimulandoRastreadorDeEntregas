<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rastreio de Entregas — SSE Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Variables ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0c0f14;
      --surface:   #151921;
      --surface-2: #1c2230;
      --border:    #2a3040;
      --text:      #e4e8f1;
      --text-dim:  #6b7a94;
      --accent:    #3b82f6;
      --accent-glow: rgba(59, 130, 246, .25);
      --green:     #22c55e;
      --green-glow: rgba(34, 197, 94, .2);
      --amber:     #f59e0b;
      --amber-glow: rgba(245, 158, 11, .15);
      --red:       #ef4444;
      --radius:    12px;
      --font-body: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Background texture ────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, var(--accent-glow) 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, rgba(34,197,94,.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ────────────────────────────────────────── */
    .app {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* ── Header ────────────────────────────────────────── */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .header__badge {
      display: inline-block;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .3rem .9rem;
      font-family: var(--font-mono);
      font-size: .7rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.2;
    }
    .header h1 span { color: var(--accent); }
    .header p {
      color: var(--text-dim);
      margin-top: .5rem;
      font-size: .95rem;
      font-weight: 300;
    }

    /* ── Controls ───────────────────────────────────────── */
    .controls {
      display: flex;
      gap: .75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .btn {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: .85rem;
      border: none;
      border-radius: var(--radius);
      padding: .7rem 1.4rem;
      cursor: pointer;
      transition: all .2s ease;
    }
    .btn--primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .btn--primary:hover { background: #2563eb; transform: translateY(-1px); }
    .btn--primary:active { transform: translateY(0); }

    .input-group {
      display: flex;
      flex: 1;
      min-width: 200px;
    }
    .input-group input {
      flex: 1;
      font-family: var(--font-mono);
      font-size: .85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: var(--radius) 0 0 var(--radius);
      padding: .7rem 1rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .input-group input::placeholder { color: var(--text-dim); }
    .input-group input:focus { border-color: var(--accent); }
    .input-group .btn {
      border-radius: 0 var(--radius) var(--radius) 0;
      white-space: nowrap;
    }

    /* ── Connection indicator ───────────────────────────── */
    .conn-status {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-family: var(--font-mono);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-dim);
      margin-bottom: 1.5rem;
      padding: .5rem .85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: fit-content;
    }
    .conn-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background .3s;
    }
    .conn-dot.connected {
      background: var(--green);
      box-shadow: 0 0 8px var(--green-glow);
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    /* ── Tracking card ─────────────────────────────────── */
    .tracker {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      animation: fade-in .4s ease;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .tracker__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: .5rem;
    }
    .tracker__id {
      font-family: var(--font-mono);
      font-size: .9rem;
      font-weight: 600;
      color: var(--accent);
    }
    .tracker__time {
      font-family: var(--font-mono);
      font-size: .7rem;
      color: var(--text-dim);
    }

    /* ── Progress bar ──────────────────────────────────── */
    .progress-bar {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 1.75rem;
    }
    .progress-step {
      display: flex;
      align-items: center;
      flex: 1;
    }
    .progress-step:last-child { flex: 0; }
    .progress-node {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .65rem;
      font-weight: 600;
      font-family: var(--font-mono);
      color: var(--text-dim);
      flex-shrink: 0;
      transition: all .4s ease;
      position: relative;
    }
    .progress-node.done {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
      box-shadow: 0 0 12px var(--green-glow);
    }
    .progress-node.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 16px var(--accent-glow);
      animation: pulse-node 2s infinite;
    }
    @keyframes pulse-node {
      0%, 100% { box-shadow: 0 0 16px var(--accent-glow); }
      50%      { box-shadow: 0 0 28px var(--accent-glow); }
    }
    .progress-line {
      flex: 1;
      height: 2px;
      background: var(--border);
      transition: background .4s ease;
    }
    .progress-line.filled {
      background: var(--green);
      box-shadow: 0 0 6px var(--green-glow);
    }

    /* ── Timeline ──────────────────────────────────────── */
    .timeline { padding-left: .25rem; }
    .timeline-item {
      display: flex;
      gap: 1rem;
      padding-bottom: 1.25rem;
      position: relative;
      animation: slide-in .35s ease;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .timeline-item:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 11px;
      top: 28px;
      width: 2px;
      bottom: 0;
      background: var(--border);
    }
    .timeline-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }
    .timeline-dot.latest {
      border-color: var(--accent);
      background: var(--accent);
    }
    .timeline-dot.latest::after {
      content: '';
      width: 6px; height: 6px;
      background: #fff;
      border-radius: 50%;
    }
    .timeline-dot.completed {
      border-color: var(--green);
      background: var(--green);
    }
    .timeline-dot.completed::after {
      content: '✓';
      color: #fff;
      font-size: .6rem;
    }
    .timeline-body h4 {
      font-size: .88rem;
      font-weight: 600;
      margin-bottom: .15rem;
    }
    .timeline-body p {
      font-size: .8rem;
      color: var(--text-dim);
      font-weight: 300;
    }
    .timeline-body .meta {
      font-family: var(--font-mono);
      font-size: .68rem;
      color: var(--text-dim);
      margin-top: .3rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* ── Log console ───────────────────────────────────── */
    .log-section {
      margin-top: 2rem;
    }
    .log-section h3 {
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-dim);
      margin-bottom: .75rem;
      font-family: var(--font-mono);
    }
    .log {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      max-height: 200px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: .72rem;
      line-height: 1.8;
      color: var(--text-dim);
    }
    .log-entry { animation: fade-in .3s ease; }
    .log-entry .log-time { color: var(--text-dim); }
    .log-entry .log-event { color: var(--green); }
    .log-entry .log-error { color: var(--red); }
    .log-entry .log-info  { color: var(--amber); }

    /* ── Empty state ───────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
    }
    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      opacity: .5;
    }
    .empty-state p {
      font-size: .9rem;
      font-weight: 300;
    }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 500px) {
      .header h1 { font-size: 1.5rem; }
      .controls { flex-direction: column; }
      .input-group { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header__badge">⚡ Server-Sent Events</div>
      <h1>Rastreio <span>em Tempo Real</span></h1>
      <p>Crie entregas simuladas e acompanhe cada etapa via SSE EventStream.</p>
    </header>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn--primary" id="btnCreate">+ Nova Entrega</button>
      <div class="input-group">
        <input type="text" id="inputId" placeholder="Código (ex: A1B2C3D4)" />
        <button class="btn btn--primary" id="btnTrack">Rastrear</button>
      </div>
    </div>

    <!-- Connection indicator -->
    <div class="conn-status" id="connStatus">
      <div class="conn-dot" id="connDot"></div>
      <span id="connText">Desconectado</span>
    </div>

    <!-- Tracker area -->
    <div id="trackerArea">
      <div class="empty-state">
        <div class="icon">📦</div>
        <p>Crie uma nova entrega ou insira um código para rastrear.</p>
      </div>
    </div>

    <!-- Event log -->
    <div class="log-section">
      <h3>Event Log (SSE Raw)</h3>
      <div class="log" id="logArea"></div>
    </div>
  </div>

  <script>
    // ── Config ──────────────────────────────────────────
    const API = window.__API_URL__ || "http://localhost:3060";

    // ── DOM refs ────────────────────────────────────────
    const btnCreate  = document.getElementById("btnCreate");
    const btnTrack   = document.getElementById("btnTrack");
    const inputId    = document.getElementById("inputId");
    const connDot    = document.getElementById("connDot");
    const connText   = document.getElementById("connText");
    const trackerArea = document.getElementById("trackerArea");
    const logArea    = document.getElementById("logArea");

    let currentES = null;   // EventSource ativo
    let currentId = null;
    let updates   = [];

    // ── Helpers ─────────────────────────────────────────
    function logEntry(type, msg) {
      const time = new Date().toLocaleTimeString("pt-BR");
      const cls  = type === "event" ? "log-event"
                 : type === "error" ? "log-error"
                 : "log-info";
      logArea.innerHTML = `<div class="log-entry"><span class="log-time">[${time}]</span> <span class="${cls}">${msg}</span></div>` + logArea.innerHTML;
    }

    function setConnected(connected) {
      connDot.classList.toggle("connected", connected);
      connText.textContent = connected ? `Conectado — ${currentId}` : "Desconectado";
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    // ── Render tracker ──────────────────────────────────
    function renderTracker() {
      if (updates.length === 0) return;

      const latest  = updates[updates.length - 1];
      const total   = latest.totalStages;
      const current = latest.stage;

      // Progress bar nodes
      let progressHTML = "";
      for (let i = 0; i < total; i++) {
        const cls = i < current ? "done" : i === current ? "active" : "";
        progressHTML += `<div class="progress-step">
          <div class="progress-node ${cls}">${i + 1}</div>
          ${i < total - 1 ? `<div class="progress-line ${i < current ? "filled" : ""}"></div>` : ""}
        </div>`;
      }

      // Timeline items (reversed — most recent first)
      let timelineHTML = "";
      for (let i = updates.length - 1; i >= 0; i--) {
        const u = updates[i];
        const isLatest = i === updates.length - 1;
        const isDelivered = u.status === "entregue";
        const dotCls = isLatest && !isDelivered ? "latest"
                     : i < updates.length - 1 || isDelivered ? "completed"
                     : "";
        timelineHTML += `
          <div class="timeline-item">
            <div class="timeline-dot ${dotCls}"></div>
            <div class="timeline-body">
              <h4>${u.label}</h4>
              <p>${u.detail}</p>
              <div class="meta">
                <span>📍 ${u.location}</span>
                <span>🕐 ${formatTime(u.timestamp)}</span>
              </div>
            </div>
          </div>`;
      }

      trackerArea.innerHTML = `
        <div class="tracker">
          <div class="tracker__header">
            <span class="tracker__id">📦 ${currentId}</span>
            <span class="tracker__time">Criado às ${formatTime(updates[0].timestamp)}</span>
          </div>
          <div class="progress-bar">${progressHTML}</div>
          <div class="timeline">${timelineHTML}</div>
        </div>`;
    }

    // ── SSE Connection ──────────────────────────────────
    function connectSSE(deliveryId) {
      if (currentES) {
        currentES.close();
        logEntry("info", `Conexão anterior encerrada.`);
      }

      currentId = deliveryId;
      updates = [];

      logEntry("info", `Abrindo EventSource → ${API}/api/deliveries/${deliveryId}/stream`);
      const es = new EventSource(`${API}/api/deliveries/${deliveryId}/stream`);
      currentES = es;

      es.addEventListener("delivery-update", (e) => {
        const data = JSON.parse(e.data);
        updates.push(data);
        logEntry("event", `delivery-update → ${data.label} (${data.status})`);
        renderTracker();
      });

      es.onopen = () => {
        setConnected(true);
        logEntry("info", "Conexão SSE estabelecida ✔");
      };

      es.onerror = () => {
        setConnected(false);
        logEntry("error", "Erro na conexão SSE — tentando reconectar...");
      };
    }

    // ── Actions ─────────────────────────────────────────
    btnCreate.addEventListener("click", async () => {
      btnCreate.disabled = true;
      btnCreate.textContent = "Criando...";
      try {
        const res  = await fetch(`${API}/api/deliveries`, { method: "POST" });
        const data = await res.json();
        logEntry("info", `Entrega criada: ${data.deliveryId}`);
        inputId.value = data.deliveryId;
        connectSSE(data.deliveryId);
      } catch (err) {
        logEntry("error", `Falha ao criar entrega: ${err.message}`);
      } finally {
        btnCreate.disabled = false;
        btnCreate.textContent = "+ Nova Entrega";
      }
    });

    btnTrack.addEventListener("click", () => {
      const id = inputId.value.trim().toUpperCase();
      if (!id) return;
      connectSSE(id);
    });

    inputId.addEventListener("keydown", (e) => {
      if (e.key === "Enter") btnTrack.click();
    });
  </script>
</body>
</html>
